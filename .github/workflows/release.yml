name: Release & Publish NuGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.0.1 or 1.0.0-rc.1)'
        required: true
        type: string
      dry_run:
        description: 'Pack and verify only — do not publish to NuGet or push tag'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  publish:
    name: Publish Packages to NuGet.org
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Parse and validate SemVer input
        id: version
        run: |
          python3 -c "
          import sys, re
          raw = sys.argv[1]
          ver = raw[1:] if raw.startswith('v') else raw
          pattern = r'^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'
          m = re.match(pattern, ver)
          if not m:
              print(f'FAIL: \"{raw}\" is not a valid SemVer 2.0.0 version string', file=sys.stderr)
              sys.exit(1)
          is_prerelease = 'true' if m.group(4) is not None else 'false'
          with open(sys.argv[2], 'a') as f:
              f.write(f'version={ver}\n')
              f.write(f'tag=v{ver}\n')
              f.write(f'is_prerelease={is_prerelease}\n')
          print(f'SemVer OK: version={ver}, is_prerelease={is_prerelease}')
          " "${{ inputs.version }}" "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3

      - name: Setup .NET SDKs (8.0.x and 9.0.x)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore dependencies
        run: dotnet restore Parquet.TypeProvider.sln

      - name: Generate Python Test Datasets (PyArrow)
        run: uv run --with pyarrow scripts/generate_test_data.py

      - name: Build Solution (Release)
        run: |
          dotnet build Parquet.TypeProvider.sln --configuration Release --no-restore \
            -warnaserror -p:Version=${{ steps.version.outputs.version }}

      - name: Run Tests
        run: dotnet test Parquet.TypeProvider.sln --configuration Release --no-build

      - name: Pack All Packages
        run: |
          dotnet pack Parquet.TypeProvider.sln --configuration Release --no-build \
            --output ./nupkgs -p:Version=${{ steps.version.outputs.version }}

      - name: Verify Package Layout
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          cd nupkgs
          pkg="Parquet.TypeProvider.${version}.nupkg"

          test -f "$pkg" || { echo "FAIL: $pkg not produced"; ls -la; exit 1; }

          for tfm in net8.0 net9.0; do
            unzip -Z1 "$pkg" | grep -q "^lib/$tfm/Parquet\.TypeProvider\.Runtime\.dll$" \
              || { echo "FAIL: Runtime assembly missing from lib/$tfm/"; exit 1; }

            unzip -Z1 "$pkg" | grep -q "^typeproviders/fsharp41/$tfm/Parquet\.TypeProvider\.DesignTime\.dll$" \
              || { echo "FAIL: DesignTime assembly missing from typeproviders/fsharp41/$tfm/"; exit 1; }
          done

          echo "Package layout OK for $version."

      - name: Login to NuGet via OIDC (Trusted Publishing)
        if: ${{ !inputs.dry_run }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER || 'rtk_13' }}

      - name: Push to NuGet.org
        if: ${{ !inputs.dry_run }}
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate \
            --no-symbols

      - name: Push to GitHub Packages
        if: ${{ !inputs.dry_run }}
        run: |
          dotnet nuget add source --username rtkelly13 \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text \
            --name github "https://nuget.pkg.github.com/rtkelly13/index.json" || true

          dotnet nuget push ./nupkgs/*.nupkg \
            --source github \
            --skip-duplicate \
            --no-symbols

      - name: Create Git Tag & GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: ./nupkgs/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
