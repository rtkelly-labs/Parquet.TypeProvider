name: Performance Benchmarks & Baseline Verification

on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'BenchmarkDotNet filter pattern'
        required: false
        default: '*'

permissions:
  contents: write
  pull-requests: write

jobs:
  run-benchmarks:
    name: Run BenchmarkDotNet Performance Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore benchmarks/Parquet.TypeProvider.Benchmarks/Parquet.TypeProvider.Benchmarks.fsproj

      - name: Build benchmarks (Release)
        run: dotnet build benchmarks/Parquet.TypeProvider.Benchmarks/Parquet.TypeProvider.Benchmarks.fsproj --configuration Release --no-restore

      - name: Execute BenchmarkDotNet Suite
        run: |
          dotnet run -c Release --project benchmarks/Parquet.TypeProvider.Benchmarks/Parquet.TypeProvider.Benchmarks.fsproj --no-build -- --filter "${{ github.event.inputs.filter || '*' }}"

      - name: Upload Benchmark Results Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results
          path: |
            BenchmarkDotNet.Artifacts/results/*.csv
            BenchmarkDotNet.Artifacts/results/*.html
            BenchmarkDotNet.Artifacts/results/*.md
            BenchmarkDotNet.Artifacts/results/*.json
